
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contador de Clics</title>


    <link rel="stylesheet" href="index.css">
</head>

<body>


    <div class="aplicacion">


        <main class="contenido">

            <section class="tarjeta">


                <h1>Interactividad con el DOM</h1>


                <p class="descripcion">
                    Haz clic en el botón para incrementar el contador
                    y registrar la hora exacta del evento en la tabla.
                </p>


                <div id="contador" class="contador">
                    0
                </div>


                <button id="botonClic" type="button">
                    ¡Haz Clic Aquí!
                </button>


                <div class="contenedor-tabla">

                    <table>

                        <thead>
                            <tr>
                                <th>N° Clic</th>
                                <th>Hora</th>
                            </tr>
                        </thead>

                        <tbody id="tablaRegistros">
            
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="index.js"></script>

</body>

</html>
